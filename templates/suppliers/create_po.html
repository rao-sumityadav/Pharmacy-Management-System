{% extends "base.html" %}

{% block title %}Create Purchase Order{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-6 space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">New Purchase Order</h1>
        <a href="{{ url_for('suppliers.purchase_orders') }}" class="px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
            Cancel
        </a>
    </div>

    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Select Supplier *</label>
                <select name="supplier_id" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <option value="">-- Choose Supplier --</option>
                    {% for s in suppliers %}
                    <option value="{{ s.id }}">{{ s.name }} ({{ s.contact_number }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Select Medicine to Restock *</label>
                <select name="medicine_id" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <option value="">-- Choose Medicine --</option>
                    {% for m in medicines %}
                    <option value="{{ m.id }}" {% if pre_selected_med_id == m.id %}selected{% endif %}>
                        {{ m.name }} (Current Stock: {{ m.quantity }}, Cost: ₹{{ "%.2f"|format(m.cost_price) }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Order Quantity (Units) *</label>
                    <input type="number" name="quantity" min="1" value="50" required
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Unit Cost Price (₹) *</label>
                    <input type="number" step="0.01" name="unit_cost" min="0.1" value="10.00" required
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Notes / Instructions</label>
                <textarea name="notes" rows="2" placeholder="e.g. Urgent restock, requires cold storage shipment..."
                          class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
            </div>

            <div class="pt-3">
                <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                    Place Purchase Order
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
