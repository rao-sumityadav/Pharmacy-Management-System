{% extends "base.html" %}

{% block title %}Register - PharmaCare PMS{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-8">
    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-xl font-bold shadow-sm">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">New Staff / Pharmacy Registration</h1>
            <p class="text-xs text-slate-500">Create an account to manage your pharmacy inventory and billing</p>
        </div>

        <form method="POST" action="{{ url_for('auth.signup') }}" class="space-y-4">
            <!-- Role Selection -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-2">Select Your Role</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer border border-slate-200 rounded-xl p-3 flex items-center gap-3 hover:border-emerald-500 transition has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50/50">
                        <input type="radio" name="role" value="admin" {% if role == 'admin' %}checked{% endif %} onchange="toggleShopFields(true)" class="text-emerald-600 focus:ring-emerald-500">
                        <div>
                            <div class="text-xs font-bold text-slate-800">Admin</div>
                            <div class="text-[10px] text-slate-500">Medical Shop Owner</div>
                        </div>
                    </label>
                    <label class="cursor-pointer border border-slate-200 rounded-xl p-3 flex items-center gap-3 hover:border-emerald-500 transition has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50/50">
                        <input type="radio" name="role" value="pharmacist" {% if role != 'admin' %}checked{% endif %} onchange="toggleShopFields(false)" class="text-emerald-600 focus:ring-emerald-500">
                        <div>
                            <div class="text-xs font-bold text-slate-800">Pharmacist</div>
                            <div class="text-[10px] text-slate-500">Counter & Operations</div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Admin Specific Fields -->
            <div id="shopFieldsContainer" class="{% if role != 'admin' %}hidden{% endif %} space-y-4 p-4 bg-slate-50 rounded-2xl border border-slate-200">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Medical Store / Pharmacy Name</label>
                    <input type="text" name="shop_name" placeholder="e.g. Apollo Pharmacy / City Meds"
                           class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Store Address</label>
                    <input type="text" name="address" placeholder="e.g. 102 Main Road, Medical Market"
                           class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <!-- General Fields -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name *</label>
                    <input type="text" name="name" required placeholder="Dr. / Mr. / Ms. John Doe"
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Phone Number</label>
                    <input type="text" name="phone" placeholder="+91 9876543210"
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address *</label>
                <input type="email" name="email" required placeholder="user@pharmacy.com"
                       class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Password *</label>
                    <input type="password" name="password" required minlength="6" placeholder="At least 6 characters"
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Confirm Password *</label>
                    <input type="password" name="confirm_password" required minlength="6" placeholder="Repeat password"
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-md shadow-emerald-600/20 transition">
                Create Account & Generate User ID
            </button>
        </form>

        <div class="pt-2 border-t border-slate-100 text-center text-xs text-slate-500">
            Already have an account? <a href="{{ url_for('auth.login') }}" class="font-bold text-emerald-600 hover:underline">Sign In</a>
        </div>
    </div>
</div>

<script>
function toggleShopFields(show) {
    const container = document.getElementById("shopFieldsContainer");
    if (show) {
        container.classList.remove("hidden");
    } else {
        container.classList.add("hidden");
    }
}
</script>
{% endblock %}
