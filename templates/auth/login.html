{% extends "base.html" %}

{% block title %}Sign In - Staff Portal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-xl font-bold shadow-sm">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Staff Portal Login</h1>
            <p class="text-xs text-slate-500">Enter your credentials to access your PMS dashboard</p>
        </div>

        <!-- Quick Demo Switcher Buttons -->
        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
            <div class="text-[11px] font-semibold text-slate-500 text-center uppercase tracking-wider">Quick Fill Demo Account</div>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="fillCredentials('admin@pharmacy.com', 'admin123')" class="px-3 py-1.5 bg-white hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200 rounded-xl text-xs font-semibold shadow-sm transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-user-shield text-emerald-600"></i> Admin
                </button>
                <button type="button" onclick="fillCredentials('pharmacist@pharmacy.com', 'pharma123')" class="px-3 py-1.5 bg-white hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 rounded-xl text-xs font-semibold shadow-sm transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-user-nurse text-blue-600"></i> Pharmacist
                </button>
            </div>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-sm">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" required placeholder="name@pharmacy.com"
                           class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-sm">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs">
                <label class="flex items-center gap-2 cursor-pointer text-slate-600">
                    <input type="checkbox" name="remember" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                    <span>Keep me logged in</span>
                </label>
            </div>

            <button type="submit" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-md shadow-emerald-600/20 transition">
                Sign In to Dashboard
            </button>
        </form>

        <div class="pt-2 border-t border-slate-100 text-center text-xs text-slate-500">
            Need to register your pharmacy? <a href="{{ url_for('auth.signup') }}" class="font-bold text-emerald-600 hover:underline">Create Account</a>
        </div>
    </div>
</div>

<script>
function fillCredentials(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
