{% extends "base.html" %}

{% block title %}Upload E-Prescription{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-6 space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Upload Prescription</h1>
            <p class="text-xs text-slate-500 mt-0.5">Licensed pharmacists will review your doctor's prescription and fulfill your order</p>
        </div>
        <a href="{{ url_for('customer.portal') }}" class="px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
            Cancel
        </a>
    </div>

    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            <!-- Patient Details -->
            <div class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Patient Full Name *</label>
                        <input type="text" name="customer_name" required placeholder="Jane Doe"
                               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Contact Phone Number *</label>
                        <input type="tel" name="customer_phone" required placeholder="+91 9876543210"
                               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address (For Invoice / Updates)</label>
                    <input type="email" name="customer_email" placeholder="patient@example.com"
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <!-- Upload Box with Preview -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Prescription Document / Photo *</label>
                <div class="border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center hover:border-emerald-500 transition bg-slate-50/50">
                    <input type="file" id="prescriptionFileInput" name="prescription_file" accept=".png,.jpg,.jpeg,.webp,.pdf" required
                           onchange="handleFilePreview(this)" class="hidden">
                    <label for="prescriptionFileInput" class="cursor-pointer block space-y-2">
                        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto text-xl">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </div>
                        <div class="text-xs font-semibold text-slate-700">Click or tap to upload prescription image / PDF</div>
                        <div class="text-[11px] text-slate-400">Accepted: PNG, JPG, JPEG, WEBP, PDF (Max: 16MB)</div>
                    </label>
                    <div id="filePreviewName" class="hidden mt-3 text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 p-2 rounded-xl"></div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Delivery / Dosage Instructions (Optional)</label>
                <textarea name="notes" rows="2" placeholder="e.g. Please dispense 30-day course, prefer generic alternatives if available..."
                          class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Submit Prescription for Pharmacist Verification</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function handleFilePreview(input) {
    const preview = document.getElementById("filePreviewName");
    if (input.files && input.files[0]) {
        preview.innerText = `Selected File: ${input.files[0].name} (${(input.files[0].size / 1024).toFixed(1)} KB)`;
        preview.classList.remove("hidden");
    }
}
</script>
{% endblock %}
