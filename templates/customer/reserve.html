{% extends "base.html" %}

{% block title %}Reserve Out-of-Stock Medicine{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-6 space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Reserve Out-of-Stock Medicine</h1>
            <p class="text-xs text-slate-500 mt-0.5">We will hold this reservation and alert you via SMS/phone when restocked</p>
        </div>
        <a href="{{ url_for('customer.portal') }}" class="px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
            Cancel
        </a>
    </div>

    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
        <form method="POST" action="{{ url_for('customer.reserve') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Select Medicine to Reserve *</label>
                <select name="medicine_id" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    {% if medicine %}
                    <option value="{{ medicine.id }}" selected>{{ medicine.name }} ({{ medicine.manufacturer }})</option>
                    {% else %}
                    <option value="">-- Choose Medicine --</option>
                    {% for m in out_of_stock_meds %}
                    <option value="{{ m.id }}">{{ m.name }} ({{ m.manufacturer }})</option>
                    {% endfor %}
                    {% endif %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Your Full Name *</label>
                    <input type="text" name="customer_name" required placeholder="John Doe"
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Phone Number *</label>
                    <input type="tel" name="customer_phone" required placeholder="+91 9876543210"
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Quantity Needed *</label>
                    <input type="number" name="quantity" min="1" value="1" required
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address (Optional)</label>
                    <input type="email" name="customer_email" placeholder="patient@example.com"
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Special Notes / Urgency</label>
                <textarea name="notes" rows="2" placeholder="e.g. Prescribed for ongoing course, need 2 strips as soon as available..."
                          class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none"></textarea>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl shadow-md transition">
                    Confirm Reservation Request
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
